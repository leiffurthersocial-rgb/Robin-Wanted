<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WANTED</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #d8c49a;
      font-family: "Times New Roman", serif;
      background-image:
        radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 4px 4px;
      color: #2b1b0f;
    }

    .poster {
      max-width: 850px;
      margin: 40px auto;
      background: #f4e3b2;
      border: 12px solid #5a381e;
      box-shadow:
        0 0 0 6px #8b5a2b,
        0 15px 40px rgba(0,0,0,0.45);
      padding: 30px;
      position: relative;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(90,56,30,0.45);
      pointer-events: none;
    }

    .header-image {
      width: 100%;
      height: 460px;
      object-fit: cover;
      border: 8px solid #3f2814;
      filter: sepia(0.25) contrast(1.05);
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .wanted {
      text-align: center;
      font-size: 5rem;
      margin: 25px 0 10px;
      color: #b10000;
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow:
        2px 2px 0 #400,
        4px 4px 10px rgba(0,0,0,0.3);
    }

    .subtitle {
      text-align: center;
      font-size: 2rem;
      margin-top: 20px;
      font-weight: bold;
    }

    .crime-box {
      margin-top: 35px;
      border-top: 3px solid #5a381e;
      border-bottom: 3px solid #5a381e;
      padding: 25px 15px;
      text-align: center;
      background: rgba(255,255,255,0.15);
    }

    .crime-title {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .crime-text {
      font-size: 2.2rem;
      color: #2f1b10;
      font-style: italic;
    }

    .stamp {
      position: absolute;
      top: 35px;
      right: 35px;
      transform: rotate(18deg);
      border: 6px solid rgba(160,0,0,0.8);
      color: rgba(160,0,0,0.8);
      padding: 10px 18px;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .reward {
      margin-top: 40px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 1rem;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      .wanted {
        font-size: 3.2rem;
        letter-spacing: 4px;
      }

      .crime-text {
        font-size: 1.6rem;
      }

      .header-image {
        height: 300px;
      }

      .stamp {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="poster">

    <div class="stamp">Wanted</div>

    <!-- Replace robin.jpeg with your image file -->
    <img src="robin.jpeg" alt="Wanted Poster Image" class="header-image">

    <h1 class="wanted">WANTED!</h1>

    <div class="subtitle">
      DEAD OR ADORABLE
    </div>

    <div class="crime-box">
      <div class="crime-title">CRIMES:</div>
      <div class="crime-text">Being too cute.</div>
    </div>

    <div class="reward">
      REWARD: Unlimited Head Pats & Snacks
    </div>

    <div class="footer">
      OFFICIAL CUTE CRIMES DIVISION
    </div>

  </div>

</body>
</html>
